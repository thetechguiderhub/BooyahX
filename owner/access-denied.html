<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../assets/branding/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/branding/booyahx-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/branding/booyahx-icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="../assets/branding/booyahx-icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/branding/apple-touch-icon.png">
  <title>BooyahX — Access Denied</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .access-denied-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg);
      background: var(--bg-primary);
    }

    .access-denied-container {
      text-align: center;
      max-width: 400px;
    }

    .access-denied-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto var(--space-xl);
      background: rgba(239, 68, 68, 0.1);
      border: 2px solid rgba(239, 68, 68, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: var(--danger);
    }

    .access-denied-container h1 {
      font-size: 1.75rem;
      margin-bottom: var(--space-md);
    }

    .access-denied-container p {
      color: var(--text-secondary);
      margin-bottom: var(--space-2xl);
    }
  </style>
</head>
<body>

  <div class="access-denied-page">
    <div class="access-denied-container">
      <div class="access-denied-icon">🚫</div>
      <h1>ACCESS DENIED</h1>
      <p>Your account does not have permission to access this area.</p>
      <a href="../index.html" class="btn btn-primary btn-lg">RETURN TO BOOYAHX</a>
    </div>
  </div>

</body>
</html>
